services:
  syno-builder:
    image: ghcr.io/wuhao5/syno-builder:latest
    # Or build locally:
    # build: .
    container_name: syno-builder
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    # Bind webhook listener to localhost only so traffic goes through Synology Reverse Proxy (HTTPS)
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-9000}:${WEBHOOK_PORT:-9000}"
    volumes:
      # Required: Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Recommended: Persist state across restarts
      - syno-builder-state:/app/state
      # Optional: Mount secrets directory (for PAT, webhook_secret, and Docker BuildKit secrets)
      # Reserved files 'pat' and 'webhook_secret' are automatically excluded from build secrets
      # - /path/to/secrets:/app/secrets:ro
      # Optional: Mount individual secret files
      # - /path/to/pat:/app/secrets/pat:ro
      # - /path/to/webhook_secret:/app/secrets/webhook_secret:ro
      # Optional: Mount your Synology Container Manager project folder at the EXACT SAME path
      # to enable built-in auto-redeploy via COMPOSE_PROJECT_DIR (no post-build script needed)
      # - /volume1/docker/my-app:/volume1/docker/my-app:ro
      # Optional: Mount custom build / post-build scripts
      # - /path/to/custom-build.sh:/app/scripts/custom-build.sh:ro
      # - /path/to/post-build.sh:/app/scripts/post-build.sh:ro
    environment:
      # These can be overridden in .env file
      - GIT_REPO=${GIT_REPO}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - TRIGGER_MODE=${TRIGGER_MODE:-poll}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
      - WEBHOOK_PORT=${WEBHOOK_PORT:-9000}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/webhook}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_SECRET_FILE=${WEBHOOK_SECRET_FILE:-/app/secrets/webhook_secret}
      - GIT_PAT=${GIT_PAT:-}
      - GIT_PAT_FILE=${GIT_PAT_FILE:-/app/secrets/pat}
      - DOCKERFILE_PATH=${DOCKERFILE_PATH:-.}
      - DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME:-auto-built-image}
      - DOCKER_BUILD_FLAGS=${DOCKER_BUILD_FLAGS:-}
      # Optional: Auto-redeploy a Synology Container Manager (Docker Compose) project after build
      # - COMPOSE_PROJECT_DIR=${COMPOSE_PROJECT_DIR:-}
      # - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-}
      # - COMPOSE_SERVICE=${COMPOSE_SERVICE:-}
      # - COMPOSE_FILE=${COMPOSE_FILE:-}
      # - COMPOSE_BRANCH=${COMPOSE_BRANCH:-}
      # Optional: Override startup check behavior (default: true in poll/both, false in webhook)
      # - RUN_ON_STARTUP=${RUN_ON_STARTUP:-}
      # Optional: Custom build / post-build script paths
      # - BUILD_SCRIPT=${BUILD_SCRIPT:-}
      # - POST_BUILD_SCRIPT=${POST_BUILD_SCRIPT:-}

volumes:
  syno-builder-state:
